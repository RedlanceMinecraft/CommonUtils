dependencies {
    for (proj in rootProject.subprojects) {
        if (proj == project) continue
        api(project(proj.path))
    }

    api(platform(project(":")))
}

jar {
    enabled = false
}

sourcesJar {
    enabled = false
}

configurations {
    apiElements {
        artifacts.clear()
    }
    runtimeElements {
        artifacts.clear()
    }
    sourcesElements {
        artifacts.clear()
    }
}
