[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
jetbrains-annotations = "26.1.0"
guava = "33.7.2-jre"
gson = "2.14.0"
slf4j = "2.0.20"
log4j = "2.26.1"
disruptor = "4.0.0"
jackson = "3.2.4"
methanol = "1.9.0"
adventure = "5.2.0"
picocli = "4.7.7"
jline = "4.4.8"
spark = "1.10.166-SNAPSHOT"
emotecraft = "3.5.0-a.build.171"
playeranim = "1.2.8+mc.26.3"
junit = "6.1.3"

[libraries]
# Kotlinx
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Common
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-iostreams = { module = "org.apache.logging.log4j:log4j-iostreams", version.ref = "log4j" }
log4j-jul = { module = "org.apache.logging.log4j:log4j-jul", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }

# Jackson
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-smile = { module = "tools.jackson.dataformat:jackson-dataformat-smile", version.ref = "jackson" }

# HTTP
methanol = { module = "com.github.mizosoft.methanol:methanol", version.ref = "methanol" }
methanol-jackson3 = { module = "com.github.mizosoft.methanol:methanol-jackson3", version.ref = "methanol" }

# Adventure
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }

# Console
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-shell-jline3 = { module = "info.picocli:picocli-shell-jline3", version.ref = "picocli" }
jline-console = { module = "org.jline:jline-console", version.ref = "jline" }
jline-reader = { module = "org.jline:jline-reader", version.ref = "jline" }
jline-terminal-ffm = { module = "org.jline:jline-terminal-ffm", version.ref = "jline" }
spark-common = { module = "me.lucko:spark-common", version.ref = "spark" }

# Emotecraft
emotecraft-assets = { module = "io.github.kosmx.emotes:emotesAssets", version.ref = "emotecraft" }
emotecraft-server = { module = "io.github.kosmx.emotes:emotesServer", version.ref = "emotecraft" }
playeranim-core = { module = "com.zigythebird.playeranim:PlayerAnimationLibCore", version.ref = "playeranim" }

# Tests; the JUnit artifacts take their versions from the BOM
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
