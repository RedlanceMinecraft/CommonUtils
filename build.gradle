plugins {
    alias(libs.plugins.kotlinJvm) apply false
    alias(libs.plugins.kotlinSerialization) apply false
    id "java-platform"
}

allprojects {
    apply plugin: "maven-publish"

    version = "1.4.2"
    group = "org.redlance.common-utils"

    repositories {
        maven {
            name = "Redlance"
            url = "https://repo.redlance.org/public"
        }
        maven {
            url = "https://repo.lucko.me/"
            mavenContent {
                includeGroupAndSubgroups("me.lucko")
                includeGroupAndSubgroups("net.kyori")
            }
        }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release.set 25
    }

    publishing.repositories {
        mavenLocal()
    }
}

subprojects {
    apply plugin: "java"
    apply plugin: "java-library"

    base.archivesName = "common-utils-${project.name}"

    dependencies {
        testImplementation(platform(rootProject.libs.junit.bom))
        testImplementation(rootProject.libs.junit.jupiter.api)
        testImplementation(rootProject.libs.junit.jupiter.params)
        testRuntimeOnly(rootProject.libs.junit.jupiter.engine)
        testRuntimeOnly(rootProject.libs.junit.platform.launcher)

        testImplementation(rootProject.libs.slf4j.api)
        testImplementation(project(":log4j"))
    }

    test {
        useJUnitPlatform()
        options {
            systemProperties(System.getProperties().findAll { key, value -> key != "user.dir" })
        }

        workingDir = layout.buildDirectory.dir("test-workdir").get().asFile
        doFirst {
            workingDir.mkdirs()
        }

        jvmArgs("--enable-native-access=ALL-UNNAMED")
        testLogging {
            showStandardStreams = true
        }
    }

    java {
        withSourcesJar()
    }

    publishing.publications {
        mavenJava(MavenPublication) {
            artifactId = project.name
            from components.java
        }
    }
}

publishing.publications {
    register('mavenJava', MavenPublication) {
        from(components['javaPlatform'])
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = true
}

dependencies {
    constraints {
        for (proj in rootProject.subprojects) {
            api(project(proj.path))
        }
    }
}
