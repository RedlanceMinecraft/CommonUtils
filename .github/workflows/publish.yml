name: Publish

# A release is a v<version> tag on the commit that sets that version in build.gradle.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # A step of its own, so nothing is uploaded unless the whole build and its tests pass.
      - run: ./gradlew build
      - run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_RedlanceMinecraftUsername: ${{ secrets.RELEASE_REPO_USERNAME }}
          ORG_GRADLE_PROJECT_RedlanceMinecraftPassword: ${{ secrets.RELEASE_REPO_PASSWORD }}
